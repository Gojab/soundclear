<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" role="img" aria-label="SoundClear — Studio-Grade Web Audio Music Player">
  <defs>
    <linearGradient id="bg-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050807" />
      <stop offset="55%" stop-color="#091510" />
      <stop offset="100%" stop-color="#040706" />
    </linearGradient>
    <radialGradient id="aurora-left" cx="22%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#2EE6A6" stop-opacity="0.22" />
      <stop offset="55%" stop-color="#0AD26C" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#050807" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="aurora-right" cx="82%" cy="60%" r="48%">
      <stop offset="0%" stop-color="#1DF78E" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#050807" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bar-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00B555" stop-opacity="0.35" />
      <stop offset="55%" stop-color="#0AD26C" stop-opacity="0.78" />
      <stop offset="100%" stop-color="#2EE6A6" stop-opacity="0.98" />
    </linearGradient>
    <linearGradient id="stroke-shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2EE6A6" stop-opacity="0" />
      <stop offset="50%" stop-color="#2EE6A6" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#2EE6A6" stop-opacity="0" />
    </linearGradient>
    <pattern id="studio-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1" />
    </pattern>
    <clipPath id="frame-clip">
      <rect width="1200" height="320" rx="22" />
    </clipPath>
  </defs>

  <g clip-path="url(#frame-clip)">
    <rect width="1200" height="320" fill="url(#bg-base)" />
    <rect width="1200" height="320" fill="url(#studio-grid)" />

    <ellipse cx="260" cy="110" rx="340" ry="200" fill="url(#aurora-left)">
      <animate attributeName="cx" values="240;320;240" dur="9s" repeatCount="indefinite" />
      <animate attributeName="cy" values="100;140;100" dur="9s" repeatCount="indefinite" />
    </ellipse>
    <ellipse cx="960" cy="195" rx="310" ry="180" fill="url(#aurora-right)">
      <animate attributeName="cx" values="980;890;980" dur="11s" repeatCount="indefinite" />
    </ellipse>

    <!-- Animated Spectrum Bars (Right Studio Panel) -->
    <g transform="translate(748, 86)">
      <rect x="0" y="0" width="396" height="164" rx="16" fill="#0B1310" fill-opacity="0.72" stroke="#FFFFFF" stroke-opacity="0.08" />
      <text x="20" y="28" fill="#8EA69B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.8">REAL-TIME DSP SPECTRUM</text>
      <circle cx="364" cy="24" r="4" fill="#2EE6A6">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
      </circle>

      <!-- 22 animated equalizer bars -->
      <g transform="translate(20, 48)">
        <rect x="0"   y="62" width="10" height="34" rx="4" fill="url(#bar-grad)"><animate attributeName="height" values="28;76;36;64;28" dur="1.5s" repeatCount="indefinite"/><animate attributeName="y" values="68;20;60;32;68" dur="1.5s" repeatCount="indefinite"/></rect>
        <rect x="16"  y="46" width="10" height="50" rx="4" fill="url(#bar-grad)"><animate attributeName="height" values="48;88;30;72;48" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="48;8;66;24;48" dur="1.3s" repeatCount="indefinite"/></rect>
        <rect x="32"  y="30" width="10" height="66" rx="4" fill="url(#bar-grad)"><animate attributeName="height" values="66;34;90;42;66" dur="1.7s" repeatCount="indefinite"/><animate attributeName="y" values="30;62;6;54;30" dur="1.7s" repeatCount="indefinite"/></rect>
        <rect x="48"  y="52" width="10" height="44" rx="4" fill="url(#bar-grad)"><animate attributeName="height" values="40;82;26;68;40" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y" values="56;14;70;28;56" dur="1.2s" repeatCount="indefinite"/></rect>
        <rect x="64"  y="24" width="10" height="72" rx="4" fill="url(#bar-grad)"><animate attributeName="height" values="72;38;92;52;72" dur="1.6s" repeatCount="indefinite"/><animate attributeName="y" values="24;58;4;44;24" dur="1.6s" repeatCount="indefinite"/></rect>
        <rect x="80"  y="42" width="10" height="54" rx="4" fill="url(#bar-grad)"><animate attributeName="height" values="54;24;78;44;54" dur="1.4s" repeatCount="indefinite"/><animate attributeName="y" values="42;72;18;52;42" dur="1.4s" repeatCount="indefinite"/></rect>
        <rect x="96"  y="18" width="10" height="78" rx="4" fill="url(#bar-grad)"><animate attributeName="height" values="78;44;88;30;78" dur="1.8s" repeatCount="indefinite"/><animate attributeName="y" values="18;52;8;66;18" dur="1.8s" repeatCount="indefinite"/></rect>
        <rect x="112" y="34" width="10" height="62" rx="4" fill="url(#bar-grad)"><animate attributeName="height" values="62;86;36;70;62" dur="1.35s" repeatCount="indefinite"/><animate attributeName="y" values="34;10;60;26;34" dur="1.35s" repeatCount="indefinite"/></rect>
        <rect x="128" y="48" width="10" height="48" rx="4" fill="url(#bar-grad)"><animate attributeName="height" values="48;22;80;56;48" dur="1.55s" repeatCount="indefinite"/><animate attributeName="y" values="48;74;16;40;48" dur="1.55s" repeatCount="indefinite"/></rect>
        <rect x="144" y="28" width="10" height="68" rx="4" fill="url(#bar-grad)"><animate attributeName="height" values="68;90;42;74;68" dur="1.25s" repeatCount="indefinite"/><animate attributeName="y" values="28;6;54;22;28" dur="1.25s" repeatCount="indefinite"/></rect>
        <rect x="160" y="54" width="10" height="42" rx="4" fill="url(#bar-grad)"><animate attributeName="height" values="42;78;28;64;42" dur="1.65s" repeatCount="indefinite"/><animate attributeName="y" values="54;18;68;32;54" dur="1.65s" repeatCount="indefinite"/></rect>
        <rect x="176" y="36" width="10" height="60" rx="4" fill="url(#bar-grad)"><animate attributeName="height" values="60;32;84;46;60" dur="1.45s" repeatCount="indefinite"/><animate attributeName="y" values="36;64;12;50;36" dur="1.45s" repeatCount="indefinite"/></rect>
        <rect x="192" y="20" width="10" height="76" rx="4" fill="url(#bar-grad)"><animate attributeName="height" values="76;42;92;54;76" dur="1.75s" repeatCount="indefinite"/><animate attributeName="y" values="20;54;4;42;20" dur="1.75s" repeatCount="indefinite"/></rect>
        <rect x="208" y="44" width="10" height="52" rx="4" fill="url(#bar-grad)"><animate attributeName="height" values="52;80;28;66;52" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="44;16;68;30;44" dur="1.3s" repeatCount="indefinite"/></rect>
        <rect x="224" y="32" width="10" height="64" rx="4" fill="url(#bar-grad)"><animate attributeName="height" values="64;36;86;48;64" dur="1.5s" repeatCount="indefinite"/><animate attributeName="y" values="32;60;10;48;32" dur="1.5s" repeatCount="indefinite"/></rect>
        <rect x="240" y="56" width="10" height="40" rx="4" fill="url(#bar-grad)"><animate attributeName="height" values="40;74;24;58;40" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y" values="56;22;72;38;56" dur="1.2s" repeatCount="indefinite"/></rect>
        <rect x="256" y="38" width="10" height="58" rx="4" fill="url(#bar-grad)"><animate attributeName="height" values="58;28;82;44;58" dur="1.6s" repeatCount="indefinite"/><animate attributeName="y" values="38;68;14;52;38" dur="1.6s" repeatCount="indefinite"/></rect>
        <rect x="272" y="48" width="10" height="48" rx="4" fill="url(#bar-grad)"><animate attributeName="height" values="48;76;30;62;48" dur="1.4s" repeatCount="indefinite"/><animate attributeName="y" values="48;20;66;34;48" dur="1.4s" repeatCount="indefinite"/></rect>
        <rect x="288" y="60" width="10" height="36" rx="4" fill="url(#bar-grad)"><animate attributeName="height" values="36;68;22;52;36" dur="1.7s" repeatCount="indefinite"/><animate attributeName="y" values="60;28;74;44;60" dur="1.7s" repeatCount="indefinite"/></rect>
        <rect x="304" y="42" width="10" height="54" rx="4" fill="url(#bar-grad)"><animate attributeName="height" values="54;80;34;60;54" dur="1.35s" repeatCount="indefinite"/><animate attributeName="y" values="42;16;62;36;42" dur="1.35s" repeatCount="indefinite"/></rect>
        <rect x="320" y="56" width="10" height="40" rx="4" fill="url(#bar-grad)"><animate attributeName="height" values="40;66;26;50;40" dur="1.55s" repeatCount="indefinite"/><animate attributeName="y" values="56;30;70;46;56" dur="1.55s" repeatCount="indefinite"/></rect>
        <rect x="336" y="66" width="10" height="30" rx="4" fill="url(#bar-grad)"><animate attributeName="height" values="30;58;20;44;30" dur="1.45s" repeatCount="indefinite"/><animate attributeName="y" values="66;38;76;52;66" dur="1.45s" repeatCount="indefinite"/></rect>
      </g>
    </g>

    <!-- Left Brand & Editorial Copy -->
    <g transform="translate(56, 66)">
      <rect x="0" y="0" width="212" height="28" rx="14" fill="#2EE6A6" fill-opacity="0.12" stroke="#2EE6A6" stroke-opacity="0.32" />
      <circle cx="16" cy="14" r="4" fill="#2EE6A6">
        <animate attributeName="r" values="3.5;5;3.5" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="30" y="18" fill="#2EE6A6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" letter-spacing="1.4">ZHAFX.CORP · AUDIO SUITE</text>

      <text x="0" y="96" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="60" font-weight="800" letter-spacing="-1.6">SoundClear</text>
      <text x="2" y="136" fill="#B8C7C0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400">
        Web Audio DSP Engine, Synced Karaoke Lyrics &amp; Offline Library
      </text>

      <g transform="translate(2, 166)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#8EA69B">
        <text x="0" y="14">10-BAND BIQUAD EQ</text>
        <text x="148" y="14" fill="#2EE6A6">·</text>
        <text x="166" y="14">LUFS NORMALIZATION</text>
        <text x="322" y="14" fill="#2EE6A6">·</text>
        <text x="340" y="14">EQUAL-POWER CROSSFADE</text>
      </g>
    </g>

    <!-- Animated Bottom Horizon Line -->
    <rect x="0" y="317" width="1200" height="3" fill="url(#stroke-shine)">
      <animate attributeName="x" values="-1200;1200" dur="4.5s" repeatCount="indefinite" />
    </rect>
    <rect x="0.5" y="0.5" width="1199" height="319" rx="22" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" />
  </g>
</svg>
