<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="100%" role="img" aria-label="SoundClear Studio Web Audio Console">
  <defs>
    <linearGradient id="chassis-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040706" />
      <stop offset="48%" stop-color="#08130F" />
      <stop offset="100%" stop-color="#030505" />
    </linearGradient>

    <radialGradient id="emerald-halo" cx="76%" cy="48%" r="44%">
      <stop offset="0%" stop-color="#2EE6A6" stop-opacity="0.22" />
      <stop offset="45%" stop-color="#0AD26C" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#040706" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="champagne-halo" cx="18%" cy="22%" r="42%">
      <stop offset="0%" stop-color="#E5C07B" stop-opacity="0.09" />
      <stop offset="65%" stop-color="#2EE6A6" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#040706" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="rim-sheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.04" />
      <stop offset="35%" stop-color="#2EE6A6" stop-opacity="0.45" />
      <stop offset="68%" stop-color="#E5C07B" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04" />
    </linearGradient>

    <linearGradient id="vinyl-sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2B26" stop-opacity="0.65" />
      <stop offset="35%" stop-color="#0A100E" stop-opacity="0.92" />
      <stop offset="50%" stop-color="#2EE6A6" stop-opacity="0.22" />
      <stop offset="65%" stop-color="#090E0C" stop-opacity="0.94" />
      <stop offset="100%" stop-color="#1B2622" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="label-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2EE6A6" />
      <stop offset="55%" stop-color="#0AD26C" />
      <stop offset="100%" stop-color="#058F49" />
    </linearGradient>

    <linearGradient id="laser-sweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2EE6A6" stop-opacity="0" />
      <stop offset="50%" stop-color="#2EE6A6" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#E5C07B" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="eq-bar" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#065F3A" />
      <stop offset="60%" stop-color="#0AD26C" />
      <stop offset="100%" stop-color="#6EF7C5" />
    </linearGradient>

    <pattern id="precision-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.025" stroke-width="1" />
    </pattern>

    <clipPath id="console-clip">
      <rect width="1200" height="430" rx="24" />
    </clipPath>
  </defs>

  <g clip-path="url(#console-clip)">
    <rect width="1200" height="430" fill="url(#chassis-bg)" />
    <rect width="1200" height="430" fill="url(#precision-grid)" />
    <rect width="1200" height="430" fill="url(#emerald-halo)" />
    <rect width="1200" height="430" fill="url(#champagne-halo)" />

    <g stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1">
      <path d="M 22 34 L 22 22 L 34 22" fill="none" />
      <path d="M 1166 22 L 1178 22 L 1178 34" fill="none" />
      <path d="M 22 396 L 22 408 L 34 408" fill="none" />
      <path d="M 1166 408 L 1178 408 L 1178 396" fill="none" />
    </g>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, monospace" font-size="10.5" letter-spacing="1.8">
      <text x="52" y="40" fill="#7D968B">ZHAFX.CORP // FLAGSHIP AUDIO WORKSTATION</text>
      <text x="640" y="40" fill="#5D746B">LUFS TARGET: -14.0</text>
      <circle cx="1032" cy="36" r="3.5" fill="#2EE6A6">
        <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite" />
      </circle>
      <text x="1044" y="40" fill="#2EE6A6">MASTER BUS ACTIVE</text>
    </g>
    <line x1="52" y1="56" x2="1148" y2="56" stroke="#FFFFFF" stroke-opacity="0.07" />

    <g transform="translate(52, 92)">
      <rect x="0" y="0" width="248" height="28" rx="6" fill="#0E1C17" stroke="#E5C07B" stroke-opacity="0.32" />
      <rect x="8" y="8" width="12" height="12" rx="3" fill="#2EE6A6" />
      <text x="28" y="18" fill="#E5C07B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="600" letter-spacing="1.6">SERIES III &#183; STUDIO EDITION</text>

      <text x="-2" y="102" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-size="72" font-weight="800" letter-spacing="-2.4">SoundClear</text>
      <text x="2" y="138" fill="#B5C7BF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="400" letter-spacing="0.1">
        Mesin Web Audio DSP Real-Time &#183; Pustaka Offline &#183; Dynamic Notch
      </text>

      <g transform="translate(0, 166)">
        <rect x="0" y="0" width="540" height="72" rx="12" fill="#070E0C" fill-opacity="0.88" stroke="#FFFFFF" stroke-opacity="0.09" />
        <line x1="16" y1="36" x2="524" y2="36" stroke="#FFFFFF" stroke-opacity="0.06" stroke-dasharray="3 4" />

        <path fill="none" stroke="#2EE6A6" stroke-width="2" stroke-linecap="round"
          d="M 18 36 C 58 14, 98 58, 138 36 C 178 10, 218 62, 258 36 C 298 16, 338 56, 378 36 C 418 12, 458 60, 522 36">
          <animate attributeName="d"
            values="M 18 36 C 58 14, 98 58, 138 36 C 178 10, 218 62, 258 36 C 298 16, 338 56, 378 36 C 418 12, 458 60, 522 36;
                    M 18 36 C 58 58, 98 12, 138 36 C 178 60, 218 14, 258 36 C 298 56, 338 14, 378 36 C 418 54, 458 18, 522 36;
                    M 18 36 C 58 22, 98 50, 138 36 C 178 18, 218 54, 258 36 C 298 20, 338 52, 378 36 C 418 24, 458 48, 522 36;
                    M 18 36 C 58 14, 98 58, 138 36 C 178 10, 218 62, 258 36 C 298 16, 338 56, 378 36 C 418 12, 458 60, 522 36"
            dur="2.8s" repeatCount="indefinite" />
        </path>

        <path fill="none" stroke="#E5C07B" stroke-opacity="0.5" stroke-width="1.2"
          d="M 18 36 C 72 48, 112 22, 168 36 C 224 50, 268 20, 328 36 C 388 52, 444 22, 522 36">
          <animate attributeName="d"
            values="M 18 36 C 72 48, 112 22, 168 36 C 224 50, 268 20, 328 36 C 388 52, 444 22, 522 36;
                    M 18 36 C 72 22, 112 52, 168 36 C 224 18, 268 54, 328 36 C 388 22, 444 50, 522 36;
                    M 18 36 C 72 48, 112 22, 168 36 C 224 50, 268 20, 328 36 C 388 52, 444 22, 522 36"
            dur="3.6s" repeatCount="indefinite" />
        </path>

        <text x="16" y="18" fill="#6F897F" font-family="ui-monospace, monospace" font-size="9.5" letter-spacing="1.4">PHASE COHERENCE &#183; 48kHz / 32-BIT FLOAT DSP</text>
        <text x="454" y="18" fill="#2EE6A6" font-family="ui-monospace, monospace" font-size="9.5">0.0 dBTP</text>
      </g>

      <g transform="translate(0, 260)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
        <text x="0" y="14" fill="#FFFFFF" font-weight="700">10-BAND</text>
        <text x="0" y="30" fill="#718A80" font-size="9.5">BIQUAD EQ</text>

        <line x1="88" y1="2" x2="88" y2="32" stroke="#FFFFFF" stroke-opacity="0.1" />
        <text x="108" y="14" fill="#FFFFFF" font-weight="700">0&#8211;12s</text>
        <text x="108" y="30" fill="#718A80" font-size="9.5">CROSSFADE</text>

        <line x1="196" y1="2" x2="196" y2="32" stroke="#FFFFFF" stroke-opacity="0.1" />
        <text x="216" y="14" fill="#FFFFFF" font-weight="700">24/7</text>
        <text x="216" y="30" fill="#718A80" font-size="9.5">BG DAEMON</text>

        <line x1="300" y1="2" x2="300" y2="32" stroke="#FFFFFF" stroke-opacity="0.1" />
        <text x="320" y="14" fill="#2EE6A6" font-weight="700">INDEXEDDB</text>
        <text x="320" y="30" fill="#718A80" font-size="9.5">OFFLINE VAULT</text>

        <line x1="422" y1="2" x2="422" y2="32" stroke="#FFFFFF" stroke-opacity="0.1" />
        <text x="442" y="14" fill="#E5C07B" font-weight="700">WIN11</text>
        <text x="442" y="30" fill="#718A80" font-size="9.5">NOTCH TRAY</text>
      </g>
    </g>

    <!-- Right Column: Rotating Studio Platter + Precision Spectrum Deck -->
    <g transform="translate(650, 78)">
      <rect x="0" y="0" width="498" height="314" rx="18" fill="#070E0B" fill-opacity="0.78" stroke="#FFFFFF" stroke-opacity="0.1" />

      <!-- Rotating Turntable Platter -->
      <g transform="translate(154, 158)">
        <!-- Outer precision bezel -->
        <circle cx="0" cy="0" r="118" fill="#0B1310" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5" />
        <circle cx="0" cy="0" r="112" fill="none" stroke="#2EE6A6" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="2 8" />

        <!-- Spinning Vinyl & Label -->
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="14s" repeatCount="indefinite" />
          <circle cx="0" cy="0" r="102" fill="url(#vinyl-sheen)" stroke="#FFFFFF" stroke-opacity="0.08" />
          <circle cx="0" cy="0" r="88" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="0.8" />
          <circle cx="0" cy="0" r="74" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="0.8" />
          <circle cx="0" cy="0" r="60" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="0.8" />
          <circle cx="0" cy="0" r="46" fill="none" stroke="#2EE6A6" stroke-opacity="0.25" stroke-width="1" />

          <!-- Center SoundClear Emerald Disc -->
          <circle cx="0" cy="0" r="35" fill="url(#label-grad)" />
          <!-- Crisp Eighth-Note Vector -->
          <path d="M -8 10 V -8 L 10 -12 V 6" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
          <circle cx="-11" cy="11" r="4.2" fill="#FFFFFF" />
          <circle cx="7" cy="7" r="4.2" fill="#FFFFFF" />
          <circle cx="0" cy="0" r="3.2" fill="#050807" />
        </g>

        <!-- Minimal Studio Tonearm -->
        <g transform="translate(96, -88)">
          <circle cx="0" cy="0" r="11" fill="#141F1B" stroke="#E5C07B" stroke-opacity="0.45" />
          <circle cx="0" cy="0" r="4" fill="#E5C07B" />
          <path d="M 0 0 L -22 88 L -38 112" fill="none" stroke="#D1DFD8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
          <rect x="-44" y="108" width="12" height="7" rx="2" transform="rotate(-35 -38 112)" fill="#2EE6A6" />
        </g>
      </g>

      <!-- Right Side Vertical FFT Analyzer & Meters -->
      <g transform="translate(304, 24)">
        <text x="0" y="14" fill="#7D968B" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1.4">FFT ANALYZER</text>
        <text x="128" y="14" fill="#E5C07B" font-family="ui-monospace, monospace" font-size="10">LIVE</text>

        <g transform="translate(0, 30)">
          <rect x="0"   y="44" width="10" height="106" rx="3" fill="url(#eq-bar)"><animate attributeName="height" values="42;124;64;98;42" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="108;26;86;52;108" dur="1.3s" repeatCount="indefinite"/></rect>
          <rect x="16"  y="28" width="10" height="122" rx="3" fill="url(#eq-bar)"><animate attributeName="height" values="92;48;134;70;92" dur="1.5s" repeatCount="indefinite"/><animate attributeName="y" values="58;102;16;80;58" dur="1.5s" repeatCount="indefinite"/></rect>
          <rect x="32"  y="16" width="10" height="134" rx="3" fill="url(#eq-bar)"><animate attributeName="height" values="112;68;140;54;112" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y" values="38;82;10;96;38" dur="1.2s" repeatCount="indefinite"/></rect>
          <rect x="48"  y="52" width="10" height="98"  rx="3" fill="url(#eq-bar)"><animate attributeName="height" values="64;128;44;104;64" dur="1.6s" repeatCount="indefinite"/><animate attributeName="y" values="86;22;106;46;86" dur="1.6s" repeatCount="indefinite"/></rect>
          <rect x="64"  y="24" width="10" height="126" rx="3" fill="url(#eq-bar)"><animate attributeName="height" values="118;54;130;82;118" dur="1.4s" repeatCount="indefinite"/><animate attributeName="y" values="32;96;20;68;32" dur="1.4s" repeatCount="indefinite"/></rect>
          <rect x="80"  y="40" width="10" height="110" rx="3" fill="url(#eq-bar)"><animate attributeName="height" values="76;132;50;94;76" dur="1.25s" repeatCount="indefinite"/><animate attributeName="y" values="74;18;100;56;74" dur="1.25s" repeatCount="indefinite"/></rect>
          <rect x="96"  y="58" width="10" height="92"  rx="3" fill="url(#eq-bar)"><animate attributeName="height" values="96;42;120;68;96" dur="1.7s" repeatCount="indefinite"/><animate attributeName="y" values="54;108;30;82;54" dur="1.7s" repeatCount="indefinite"/></rect>
          <rect x="112" y="34" width="10" height="116" rx="3" fill="url(#eq-bar)"><animate attributeName="height" values="56;118;84;42;56" dur="1.35s" repeatCount="indefinite"/><animate attributeName="y" values="94;32;66;108;94" dur="1.35s" repeatCount="indefinite"/></rect>
          <rect x="128" y="62" width="10" height="88"  rx="3" fill="url(#eq-bar)"><animate attributeName="height" values="82;36;108;62;82" dur="1.55s" repeatCount="indefinite"/><animate attributeName="y" values="68;114;42;88;68" dur="1.55s" repeatCount="indefinite"/></rect>
          <rect x="144" y="76" width="10" height="74"  rx="3" fill="url(#eq-bar)"><animate attributeName="height" values="48;96;32;78;48" dur="1.45s" repeatCount="indefinite"/><animate attributeName="y" values="102;54;118;72;102" dur="1.45s" repeatCount="indefinite"/></rect>
        </g>

        <!-- Stereo Peak Meters L/R -->
        <g transform="translate(0, 204)" font-family="ui-monospace, monospace" font-size="9.5">
          <text x="0" y="10" fill="#7D968B">CH-L</text>
          <rect x="34" y="3" width="124" height="7" rx="3.5" fill="#101C18" />
          <rect x="34" y="3" width="96" height="7" rx="3.5" fill="#2EE6A6">
            <animate attributeName="width" values="78;114;88;118;78" dur="1.8s" repeatCount="indefinite" />
          </rect>

          <text x="0" y="28" fill="#7D968B">CH-R</text>
          <rect x="34" y="21" width="124" height="7" rx="3.5" fill="#101C18" />
          <rect x="34" y="21" width="92" height="7" rx="3.5" fill="#0AD26C">
            <animate attributeName="width" values="84;110;76;115;84" dur="1.6s" repeatCount="indefinite" />
          </rect>

          <text x="0" y="54" fill="#5D746B">DSP CHAIN</text>
          <text x="98" y="54" fill="#FFFFFF">ZERO-CLIP</text>
        </g>
      </g>
    </g>

    <!-- Bottom Optical Laser Trace -->
    <rect x="0" y="427" width="1200" height="3" fill="url(#rim-sheen)" />
    <rect x="-400" y="426" width="400" height="4" fill="url(#laser-sweep)">
      <animate attributeName="x" values="-400;1200" dur="3.8s" repeatCount="indefinite" />
    </rect>
    <rect x="0.5" y="0.5" width="1199" height="429" rx="24" fill="none" stroke="#FFFFFF" stroke-opacity="0.11" />
  </g>
</svg>
