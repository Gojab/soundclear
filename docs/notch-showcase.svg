<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" role="img" aria-label="Windows 11 Dynamic Notch &amp; Tray Showcase">
  <defs>
    <linearGradient id="win-wallpaper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050807" />
      <stop offset="55%" stop-color="#0B1914" />
      <stop offset="100%" stop-color="#050807" />
    </linearGradient>
    <radialGradient id="notch-glow" cx="50%" cy="0%" r="55%">
      <stop offset="0%" stop-color="#2EE6A6" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#050807" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="album-art" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2EE6A6" />
      <stop offset="55%" stop-color="#07A857" />
      <stop offset="100%" stop-color="#034224" />
    </linearGradient>
    <clipPath id="screen-clip">
      <rect x="28" y="22" width="1144" height="276" rx="20" />
    </clipPath>
  </defs>

  <rect width="1200" height="320" rx="24" fill="#030505" stroke="#FFFFFF" stroke-opacity="0.1" />

  <g clip-path="url(#screen-clip)">
    <rect x="28" y="22" width="1144" height="276" fill="url(#win-wallpaper)" />
    <rect x="28" y="22" width="1144" height="276" fill="url(#notch-glow)" />

    <rect x="64" y="108" width="320" height="156" rx="12" fill="#0B1210" fill-opacity="0.72" stroke="#FFFFFF" stroke-opacity="0.06" />
    <rect x="82" y="126" width="110" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.12" />
    <rect x="82" y="146" width="260" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.07" />
    <rect x="82" y="162" width="210" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.05" />
    <rect x="82" y="196" width="280" height="44" rx="8" fill="#101D18" stroke="#2EE6A6" stroke-opacity="0.16" />
    <text x="96" y="222" fill="#7D968B" font-family="ui-monospace, monospace" font-size="10.5">APP // FOCUS MODE ACTIVE</text>

    <rect x="816" y="108" width="320" height="156" rx="12" fill="#0B1210" fill-opacity="0.72" stroke="#FFFFFF" stroke-opacity="0.06" />
    <text x="836" y="136" fill="#E5C07B" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1.4">SYSTEM TRAY DAEMON</text>
    <text x="836" y="160" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700">Background Audio Preserved</text>
    <text x="836" y="182" fill="#8EA69B" font-family="-apple-system, sans-serif" font-size="11.5">Close-to-tray menjaga pemutaran &amp; antrean</text>
    <text x="836" y="199" fill="#8EA69B" font-family="-apple-system, sans-serif" font-size="11.5">tetap berjalan saat jendela disembunyikan.</text>
    <rect x="836" y="218" width="154" height="24" rx="6" fill="#13251E" stroke="#2EE6A6" stroke-opacity="0.3" />
    <circle cx="850" cy="230" r="3" fill="#2EE6A6" />
    <text x="862" y="234" fill="#2EE6A6" font-family="ui-monospace, monospace" font-size="9.5">NOTCH CONNECTED</text>

    <g transform="translate(360, 22)">
      <path d="M 0 0 H 480 V 66 Q 480 96 450 96 H 30 Q 0 96 0 66 Z" fill="#050706" stroke="#2EE6A6" stroke-opacity="0.4" stroke-width="1.2" />

      <rect x="22" y="18" width="54" height="54" rx="12" fill="url(#album-art)" />
      <path d="M 42 54 V 36 L 58 32 V 50" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="39" cy="54" r="3.6" fill="#FFFFFF" />
      <circle cx="55" cy="50" r="3.6" fill="#FFFFFF" />

      <text x="92" y="34" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700">Hati-Hati di Jalan</text>
      <text x="92" y="54" fill="#2EE6A6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">
        &#9834; Kukira kita akan bersama...
        <animate attributeName="opacity" values="0.65;1;0.65" dur="2.2s" repeatCount="indefinite" />
      </text>
      <text x="92" y="72" fill="#7D968B" font-family="ui-monospace, monospace" font-size="9.5">TULUS &#183; SYNCED LYRICS &#183; ALWAYS ON TOP</text>

      <!-- Subtle Progress Hairline at bottom of Notch -->
      <rect x="26" y="88" width="428" height="2" rx="1" fill="#172620" />
      <rect x="26" y="88" width="180" height="2" rx="1" fill="#2EE6A6">
        <animate attributeName="width" values="120;340;120" dur="9s" repeatCount="indefinite" />
      </rect>

      <g transform="translate(404, 28)">
        <rect x="0"  y="14" width="5" height="22" rx="2.5" fill="#2EE6A6"><animate attributeName="height" values="10;30;14;26;10" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="22;2;18;6;22" dur="1.1s" repeatCount="indefinite"/></rect>
        <rect x="9"  y="6"  width="5" height="30" rx="2.5" fill="#2EE6A6"><animate attributeName="height" values="26;12;32;16;26" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="6;20;0;16;6" dur="1.3s" repeatCount="indefinite"/></rect>
        <rect x="18" y="10" width="5" height="26" rx="2.5" fill="#E5C07B"><animate attributeName="height" values="18;32;10;24;18" dur="1.0s" repeatCount="indefinite"/><animate attributeName="y" values="14;0;22;8;14" dur="1.0s" repeatCount="indefinite"/></rect>
        <rect x="27" y="16" width="5" height="20" rx="2.5" fill="#2EE6A6"><animate attributeName="height" values="14;26;8;28;14" dur="1.4s" repeatCount="indefinite"/><animate attributeName="y" values="18;6;24;4;18" dur="1.4s" repeatCount="indefinite"/></rect>
        <rect x="36" y="12" width="5" height="24" rx="2.5" fill="#2EE6A6"><animate attributeName="height" values="22;10;28;14;22" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y" values="10;22;4;18;10" dur="1.2s" repeatCount="indefinite"/></rect>
      </g>
    </g>

    <g transform="translate(410, 146)" font-family="ui-monospace, monospace" font-size="10.5" fill="#8EA69B">
      <rect x="0" y="0" width="380" height="118" rx="14" fill="#070C0A" fill-opacity="0.88" stroke="#FFFFFF" stroke-opacity="0.09" />
      <text x="22" y="28" fill="#2EE6A6" letter-spacing="1.4">DYNAMIC NOTCH ENGINE</text>
      <text x="22" y="54" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Frameless Click-Through &amp; Hover Expand</text>
      <text x="22" y="76" fill="#8EA69B" font-family="-apple-system, sans-serif" font-size="11.5">&#8226; Penempatan otomatis di monitor utama / kursor</text>
      <text x="22" y="96" fill="#8EA69B" font-family="-apple-system, sans-serif" font-size="11.5">&#8226; Sinkronisasi lirik LRC baris demi baris + kontrol IPC</text>
    </g>
  </g>
</svg>
